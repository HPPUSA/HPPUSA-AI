name: HPPUSA-AI Phase 1 isolated tests

on:
  push:
    branches:
      - orchestra/phase1-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-node-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Generate complete lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile with clean installation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0

      - name: Upload generated lockfile for review (not committed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hppusa-node-lockfile-review
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14.8"]
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run mocked regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - name: Smoke-test Gunicorn over localhost
        env:
          GROQ_API_KEY: ""
        run: |
          set -e
          gunicorn --bind 127.0.0.1:8765 --workers 1 --timeout 30 App:app &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8765"
          for attempt in range(30):
              try:
                  with urlopen(base + "/", timeout=1) as response:
                      assert response.status == 200
                      assert b"HPPUSA AI" in response.read()
                  break
              except (URLError, TimeoutError):
                  if attempt == 29:
                      raise
                  time.sleep(0.5)
          else:
              raise RuntimeError("Gunicorn did not become ready")

          body = json.dumps({"message": "smoke test"}).encode("utf-8")
          request = Request(
              base + "/chat",
              data=body,
              headers={
              "Content-Type": "application/json",
              "CF-Connecting-IP": "192.0.2.100",
          },
              method="POST",
          )
          try:
              urlopen(request, timeout=3)
              raise AssertionError("Expected safe missing-key response")
          except HTTPError as error:
              assert error.code == 500
              payload = json.loads(error.read())
              assert "not connected" in payload["error"].lower()
          PY

  frontend-xss-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install exact frontend test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@26.1.0 dompurify@3.4.17 marked@18.1.3

      - name: Test the actual frontend formatter against XSS payloads
        run: node tests/frontend_xss.test.mjs
