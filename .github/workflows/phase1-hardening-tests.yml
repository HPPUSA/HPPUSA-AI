name: HPPUSA-AI Phase 1 isolated tests

on:
  push:
    branches:
      - orchestra/phase1-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14.8"]
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run mocked regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
